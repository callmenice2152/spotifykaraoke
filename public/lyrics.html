<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Floating Lyrics Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      -webkit-app-region: drag;
      cursor: move;
      user-select: none;
    }
    .lyric-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 3px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      transition: opacity 0.2s ease, background 0.2s ease;
      max-width: 110vw;
    }
    .lyric-box.no-bg {
      background: transparent !important;
      backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    .lyric-text {
      font-size: 9px;
      font-weight: 400;
      color: #ffffff;
      text-shadow: 0px 1px 6px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .lyric-box.no-bg .lyric-text {
      text-shadow: 0px 1px 4px rgba(0, 0, 0, 0.95), 0px 0px 2px rgba(0, 0, 0, 0.9);
    }
    .lyric-trans {
      font-size: 8px;
      font-weight: 300;
      color: #ffffff;
      opacity: 0.9;
      margin-top: 1px;
      font-style: normal;
      white-space: nowrap;
      letter-spacing: 0.1px;
    }
    .lyric-box.no-bg .lyric-trans {
      text-shadow: 0px 1px 4px rgba(0, 0, 0, 0.95), 0px 0px 2px rgba(0, 0, 0, 0.9);
    }
    .hidden {
      display: none !important;
    }
    body.sneak-mode .lyric-box {
      font-family: Consolas, monospace;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #30363d;
    }
    body.sneak-mode .lyric-box.no-bg {
      background: transparent !important;
      border: none !important;
    }
    body.sneak-mode .lyric-text {
      color: #58a6ff;
      text-shadow: none;
    }
    body.sneak-mode .lyric-trans {
      color: #7ee787;
      text-shadow: none;
    }
    .close-btn {
      display: none;
      position: absolute;
      top: -2px;
      right: 2px;
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.7);
      padding: 2px 4px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.6);
      -webkit-app-region: no-drag;
      z-index: 99;
    }
    .close-btn:hover {
      color: #ff5555;
      background: rgba(0, 0, 0, 0.9);
    }
    .lyric-box:hover .close-btn {
      display: block;
    }
  </style>
</head>
<body>
  <div class="lyric-box no-bg" id="lyricBox">
    <div class="close-btn" id="btnCloseLyrics" title="ปิด/ซ่อนแถบเนื้อเพลง (Alt+\ หรือ Alt+K)">✕</div>
    <div class="lyric-text" id="lyricText">Waiting for music...</div>
    <div class="lyric-trans hidden" id="lyricTrans"></div>
  </div>

  <script>
    try {
      const { ipcRenderer } = require('electron');
      const boxEl = document.getElementById('lyricBox');
      const textEl = document.getElementById('lyricText');
      const transEl = document.getElementById('lyricTrans');

      function notifyResize() {
        requestAnimationFrame(() => {
          const rect = boxEl.getBoundingClientRect();
          const w = Math.ceil(rect.width) + 6;
          const h = Math.ceil(rect.height) + 4;
          ipcRenderer.send('resize-lyrics-window', { width: w, height: h });
        });
      }

      ipcRenderer.on('lyric-update', (event, data) => {
        if (typeof data === 'object' && data !== null) {
          textEl.textContent = data.original || '🎵';
          if (data.translation) {
            transEl.textContent = data.translation;
            transEl.classList.remove('hidden');
          } else {
            transEl.classList.add('hidden');
          }
        } else {
          textEl.textContent = data || '🎵';
          transEl.classList.add('hidden');
        }
        notifyResize();
      });

      ipcRenderer.on('toggle-sneak-mode', (event, isSneak) => {
        if (isSneak) {
          document.body.classList.add('sneak-mode');
        } else {
          document.body.classList.remove('sneak-mode');
        }
        notifyResize();
      });

      function toggleBackground(isEnabled) {
        if (typeof isEnabled === 'boolean') {
          if (isEnabled) {
            boxEl.classList.remove('no-bg');
          } else {
            boxEl.classList.add('no-bg');
          }
        } else {
          boxEl.classList.toggle('no-bg');
        }
        notifyResize();
      }

      ipcRenderer.on('toggle-lyrics-bg', (event, isEnabled) => {
        toggleBackground(isEnabled);
      });

      boxEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        ipcRenderer.send('toggle-lyrics-bg');
      });

      boxEl.addEventListener('dblclick', (e) => {
        e.preventDefault();
        ipcRenderer.send('toggle-lyrics-bg');
      });

      // Middle-click (scroll wheel click) hides/closes the lyrics bar immediately
      boxEl.addEventListener('auxclick', (e) => {
        if (e.button === 1) {
          e.preventDefault();
          ipcRenderer.send('toggle-lyrics-view');
        }
      });

      // Close '✕' button click hides lyrics bar
      const btnCloseLyrics = document.getElementById('btnCloseLyrics');
      if (btnCloseLyrics) {
        btnCloseLyrics.addEventListener('click', (e) => {
          e.stopPropagation();
          ipcRenderer.send('toggle-lyrics-view');
        });
      }

      notifyResize();
    } catch (err) {
      console.error('Lyrics Renderer Error:', err);
    }
  </script>
</body>
</html>
